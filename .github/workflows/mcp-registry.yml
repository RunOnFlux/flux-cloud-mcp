name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry on version tags, after
# the npm package for that version has been published. Authenticates with
# GitHub OIDC, so no secret is needed; the namespace is io.github.runonflux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the npm package for this version exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view "@runonflux/flux-cloud-mcp@$VERSION" version
          jq -e --arg v "$VERSION" '.version == $v and .packages[0].version == $v' server.json
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
