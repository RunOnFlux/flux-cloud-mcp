name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry on version tags, after
# the npm package for that version has been published. Authenticates with
# GitHub OIDC, so no secret is needed; the namespace is io.github.runonflux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the npm package of this version (registry propagation can lag)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq -e --arg v "$VERSION" '.version == $v and .packages[0].version == $v' server.json
          for i in $(seq 1 30); do
            if npm view "@runonflux/flux-cloud-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "npm has $VERSION"; exit 0
            fi
            echo "npm does not have $VERSION yet, waiting ($i/30)"; sleep 20
          done
          echo "npm never served $VERSION"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
