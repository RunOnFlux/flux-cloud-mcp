name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry, after the npm package for
# that version is live. Authenticates with GitHub OIDC, so no secret is needed;
# the namespace is io.github.runonflux.
#
# Run by hand (Actions > Publish to MCP Registry > Run workflow, "Use workflow
# from" the release tag vX.Y.Z) once the staged npm version is approved. It no
# longer runs on tag pushes: publish.yml only stages the npm version, which
# stays invisible until a maintainer approves it on npmjs.com, so a tag-triggered
# run would time out in the wait below and fail before publishing anything.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the npm package of this version (registry propagation can lag)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq -e --arg v "$VERSION" '.version == $v and .packages[0].version == $v' server.json
          for i in $(seq 1 30); do
            if npm view "@runonflux/flux-cloud-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "npm has $VERSION"; exit 0
            fi
            echo "npm does not have $VERSION yet, waiting ($i/30)"; sleep 20
          done
          echo "npm never served $VERSION"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
