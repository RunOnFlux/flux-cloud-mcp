name: Publish to npm

# Publishes @runonflux/flux-cloud-mcp from CI with npm trusted publishing
# (OIDC) and a signed provenance attestation, so consumers can check that a
# given npm version was built from this repository at a given tag
# (`npm audit signatures`). There is no long-lived npm token anywhere: npm
# exchanges this job's short-lived GitHub OIDC token for a publish credential,
# and only for the repo + workflow file + environment configured as the
# package's trusted publisher on npmjs.com.
#
# Release: bump package.json "version" (and server.json), merge to master, then
# push tag vX.Y.Z. The same tag also builds the Docker image (docker.yml). Once
# a maintainer has approved the staged npm version, run "Publish to MCP
# Registry" (mcp-registry.yml) by hand on that tag.
on:
  push:
    tags: ['v*']

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: verify, test, build, publish (provenance)
    runs-on: ubuntu-latest
    # Required reviewers + "selected tags: v*" are configured on this
    # environment in the repo settings; the npm trusted publisher is bound to it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      # No dependency caches in this job: a release must not restore state
      # written by other workflow runs (cache poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No registry-url: npm gets its publish token from OIDC (trusted
          # publishing), and the .npmrc setup-node would write holds an unset
          # ${NODE_AUTH_TOKEN} that yarn v1 refuses to load.

      # Trusted publishing needs npm >= 11.5.1. Pinned exactly.
      - name: Pin npm
        run: npm install -g --ignore-scripts npm@11.19.1 && npm --version

      - name: Tag must equal package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      # Lifecycle scripts of dependencies never run on the release runner.
      # secp256k1's native addon (via @runonflux/utxo-lib) is therefore not
      # built and falls back to its pure-JS implementation; esbuild (tsx, used
      # by the tests only) runs from its platform package without the
      # postinstall check.
      - run: yarn install --frozen-lockfile --ignore-scripts
      # No `yarn audit` here: ci.yml does not run it, and it fails on the
      # current tree (7 advisories as of 0.2.7: @modelcontextprotocol/sdk and
      # its dependencies, plus elliptic via @runonflux/utxo-lib). Add it once
      # clean.
      # Same checks, in the same order, as ci.yml and prepublishOnly.
      - run: yarn type-check
      - run: yarn lint
      - run: yarn format:check
      # prepublishOnly does not run (--ignore-scripts below), so dist/, which
      # is what the tarball ships, is built here explicitly.
      - run: yarn build
      - run: yarn test

      # --ignore-scripts: publish exactly the tarball of what was built and
      # tested above (prepublishOnly would only repeat the same steps).
      - name: Stage publish with provenance (maintainer approves on npm)
        # Staged publishing: CI uploads the version (with provenance) but it is
        # NOT live until a maintainer approves it with 2FA on npmjs.com or via
        # `npm stage approve <stage-id>`. The npm trusted publisher is configured
        # without 'Allow npm publish', so a direct `npm publish` would be refused.
        run: npm stage publish --provenance --access public --ignore-scripts
