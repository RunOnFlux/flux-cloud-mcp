name: Docker image

# Builds the hosted-server image on version tags and pushes it to the GitHub
# Container Registry (public, no secrets needed). If DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets exist, the same image is also pushed to Docker Hub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The secrets context cannot be used in a step `if`, so decide here.
      PUSH_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (optional)
        if: env.PUSH_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: tags
        run: |
          TAGS="ghcr.io/runonflux/flux-cloud-mcp:${{ steps.version.outputs.version }},ghcr.io/runonflux/flux-cloud-mcp:latest"
          if [ "$PUSH_DOCKERHUB" = "true" ]; then
            TAGS="$TAGS,runonflux/flux-cloud-mcp:${{ steps.version.outputs.version }},runonflux/flux-cloud-mcp:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
